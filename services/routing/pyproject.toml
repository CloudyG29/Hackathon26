[project]
name = "routing"
version = "0.0.0"
description = "Deterministic multi-priority journey planning over the rank/leg transit network (cheapest, fastest, easiest)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
